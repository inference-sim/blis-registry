# Example trained-physics set — illustrative values only.
#
# This set exists so CI exercises the `trained-physics` backend manifest end-to-end: it
# EXTENDS the roofline `example` set (inheriting mfu_prefill / mfu_decode) and provides
# the 11 beta + 3 alpha coefficients that backend consumes. Without a committed set on
# this backend, a typo in backends/trained-physics.yaml (a misspelled or duplicated name)
# would pass CI silently — the exact bug the consumed-names check exists to catch.
#
# The NUMBERS are illustrative, NOT real registry values: R2 is value-preserving and the
# real trained-physics coefficients are transcribed by R2G3 (blis-registry#3), which also
# owns any refinement of these names to semantic ones. Do not cite these values.
name: example-trained-physics
backend: trained-physics
extends: example

coefficients:
  # 11 step-time regression coefficients (betas). Illustrative additive rates.
  beta_1:  {value: 1.0, units: us_per_step,    method: assumed, fitted: false, rationale: "Illustrative placeholder; real value in R2G3.", scope: {hardware: [H100], tp: [1, 8]}}
  beta_2:  {value: 1.0, units: us_per_layer,   method: assumed, fitted: false, rationale: "Illustrative placeholder; real value in R2G3.", scope: {hardware: [H100], tp: [1, 8]}}
