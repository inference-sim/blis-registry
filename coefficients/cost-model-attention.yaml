# Decode-attention primitive — every entry from NVIDIA AISimulate.
#
# This set exists because the cost model was wrong about attention by an order of
# magnitude, and the data to correct it was already on disk and unused.
#
# The model priced decode attention as a KV read at derated HBM bandwidth. Measured against
# AISimulate's generation-attention sweeps — 40,367 full-attention points per part, across
# batch sizes 1 to 128, context lengths 1 to 65535, 11 KV-head counts, 4 head dimensions and
# both cache dtypes — that form is wrong by 9.7x on L40S to 35.8x on GB200. Two separate
# errors, both structural rather than a bad constant:
#
#   NO FLOOR. An attention kernel costs 11 to 18.5 microseconds at minimum, whatever the
#   context. A pure-bandwidth model charges nothing for the launch and setup, so at short
#   context it predicts a step hundreds of times faster than measured.
#
#   WRONG BANDWIDTH. The kernel reaches 0.58 to 0.90 of datasheet HBM bandwidth depending
#   on the part, not the 0.8 the generic hbm_derate assumes. The spread is wide enough that
#   one derate cannot serve all five parts, and the ordering is not the one intuition
#   suggests: H200 achieves the SMALLEST fraction of its own peak (0.58) because that peak
#   is the largest.
#
# The form is the same shape the collectives use, and for the same reason — a fixed setup
# cost that a large transfer amortizes but a small one does not:
#
#     latency = attention_decode_floor + kv_bytes / attention_decode_rate
#
# where kv_bytes is batch * context * 2 * kv_heads * head_dim * cache_width. Both parameters
# are fitted per part by minimising the mean absolute log ratio, which weighs an
# under-prediction and an over equally rather than letting the long-context tail dominate a
# fit that must also be right at decode sizes.
#
# SCOPE LIMIT, stated because it is easy to miss: only FULL attention is fitted. The sweeps
# also cover sliding windows at 128, 2048 and 8192, where the bytes read are bounded by the
# window rather than the context. Those are a different byte count and would need their own
# entries; a windowed model has none yet, so a sliding-window layer is priced by the full
# attention entries and will be overstated at long context.
#
# Reproduce with scripts/fit_attention.py.
kind: CoefficientSet
name: cost-model-attention

coefficients:
  - attention_decode_floor:
      value: 13.5
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/attention/vllm/0.25.0/generation_attention_perf.parquet (NVIDIA H200), 34818 full-attention points", role: primary}
      rationale: >
        The minimum cost of a decode attention kernel, independent of context. Fitted
        jointly with attention_decode_rate over 34818 points; the pair takes the geometric
        error from 33.7x under a pure-KV-read model to 1.499x. Fitted on the vLLM
        collection rather than TRT-LLM: BLIS prices vLLM serving, and on 25858 geometries
        matched exactly between the two collections vLLM is slower by a median 1.2694x.
  - attention_decode_rate:
      value: 2592000.0
      units: bytes_per_us
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/attention/vllm/0.25.0/generation_attention_perf.parquet (NVIDIA H200), 34818 full-attention points", role: primary}
      rationale: >
        2.59 TB/s, which is 0.54 of this part's 4.8 TB/s datasheet bandwidth. The smallest
        fraction of the five parts fitted, and not because the kernel is worse here: the
        denominator is the largest.

  - attention_decode_floor:
      value: 14.5
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/attention/vllm/0.25.0/generation_attention_perf.parquet (NVIDIA H100 80GB HBM3), 34818 full-attention points", role: primary}
      rationale: >
        Identical to H200's, which the shared GH100 die predicts: a launch and setup cost is
        set by the die and the driver rather than by memory bandwidth. Paired rate brings the
        geometric error from 25.6x to 1.446x, on the vLLM collection.
  - attention_decode_rate:
