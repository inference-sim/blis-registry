# Roofline MFU discounts — A100-80 (the A100-SXM alias).
#
# A100-80 is the alias defaults.yaml uses for all A100 model entries (catalog BC-14); it
# ships the same chip facts and the same MFU pair as A100-SXM. It is a distinct catalog
# Hardware object with its own scope, so it gets its own standalone roofline set here —
# each entry is scoped to one GPU, so the identical numbers are stated per set rather than
# shared. Only the two MFU discounts are transcribed; the vendor specs stay catalog facts
# (hardware/a100-80.yaml), cited by the roofline backend at run time.
#
# Value-preserving: 0.38 / 0.18 are the shipped A100-80 numbers (catalog hardware/a100-80.yaml
# and inference-sim hardware_config.json), identical to A100-SXM by construction of the alias.
kind: CoefficientSet
name: roofline-a100-80

coefficients:
  - mfu_prefill:
      value: 0.38
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
        - {kind: publication, cite: "Korthikanti et al., Reducing Activation Recomputation (MLSys 2022): 54.2% MFU on A100 (training)", role: upper_bound}
        - {kind: publication, cite: "Chowdhery et al., PaLM (2022): 46.2% MFU on TPUv4", role: supporting}
      rationale: >
        A100-80 is an alias of A100-SXM and carries the same #589 literature basis: training
        reaches ~54% MFU, vLLM production prefill 35-40% on 1K-4K-token batches. Discounted to 0.38 for
        inference (no backward-pass optimization, variable batch sizes), conservatively below
        the training ceiling.
      scope: {hardware: [A100-80]}

  - mfu_decode:
      value: 0.18
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
      rationale: >
        A100-80 decode is heavily memory-bound (same die as A100-SXM): the ~156 FLOP/byte
        roofline crossover sits far above small-batch decode's ~2-4 FLOP/byte, and even
        large-batch (B≈128) compute-bound decode measures only 15-20% utilization. Held at
        0.18, the upper end of that range and conservative for capacity planning.
      scope: {hardware: [A100-80]}
