# Backend manifest: trained-physics
#
# A backend declares the coefficient NAMES it consumes. See backends/roofline.yaml for
# the ABSENT-vs-ZERO contract this list encodes.
#
# The trained-physics backend prices latency from a regression over the operator basis:
# eleven step-time coefficients (the betas) and three per-request overheads outside the
# step loop (the alphas). A trained-physics set EXTENDS the roofline set, inheriting the
# MFU discounts it does not override (see the `extends` mechanism in the schema), so
# those two names are consumed here as well.
#
# The eleven beta / three alpha NAMES below enumerate the coefficients of the
# trained-physics form. Their VALUES are transcribed (value-preserving, R2G3) into the
# per-GPU sets operators/trained-physics-<gpu>.yaml, each of which extends its GPU's
# roofline set for the inherited MFU pair; a later task (R2G4) may refine these positional
# names to semantic ones without changing any value. The count (11 beta + 3 alpha) and the
# inherited MFU pair are fixed by the design; this manifest is the contract those values
# are written against.
consumes:
  # Inherited from the roofline set via `extends`.
  - mfu_prefill
  - mfu_decode
  # Step-time regression coefficients (11 betas).
  - beta_1
  - beta_2
  - beta_3
  - beta_4
  - beta_5
  - beta_6
  - beta_7
  - beta_8
  - beta_9
  - beta_10
  - beta_11
  # Per-request overheads outside the step loop (3 alphas).
  - alpha_1
  - alpha_2
  - alpha_3
