# Schema fixture — NOT registry data.
#
# This file exists so CI validates a committed set on every run (an empty registry would
# make the validation gate vacuous) and so a reader can see every schema feature in one
# place. It is deliberately synthetic: it feeds the fake `example` backend (see
# backends/example.yaml), and its coefficient names (coeff_a, coeff_b, …) and values are
# invented. Nothing here is a real learned number — the real coefficient sets live in
# operators/ and are transcribed by later tasks. Do not cite anything in this file.
#
# The set is identified by its FILENAME (this file is the set `example`); there is no
# `name` field. The backend `example` consumes coeff_a and coeff_b; the two extra entries
# below are present but not consumed, which is allowed and demonstrates the ABSENT case
# and the priced-at-zero (`not_charged`) case the schema distinguishes.
kind: CoefficientSet
backend: example

coefficients:
  # A literature entry: structured sources, a rationale, and an explicit ci95 interval.
  coeff_a:
    value: 0.45
    units: dimensionless
    method: literature
    fitted: false
    sources:
      - {kind: discussion, cite: "example discussion, not a real reference", role: primary}
      - {kind: publication, cite: "example paper, not a real reference", role: upper_bound}
    rationale: "Synthetic literature entry to exercise the sources/ci95/rationale fields."
    scope: {hardware: [ExampleGPU]}
    ci95: [0.40, 0.50]
    supersedes: null

  # A measured entry: fitted true is permitted only for method: measured.
  coeff_b:
    value: 12.5
    units: us_per_layer
    method: measured
    fitted: true
    scope: {hardware: [ExampleGPU], tp: [1, 8]}

  # A term priced at exactly zero cost: ZERO is distinct from ABSENT and requires
  # method: not_charged. Present but not consumed by `example`, which is allowed.
  coeff_zero:
    value: 0.0
    units: us_per_hop
    method: not_charged
    fitted: false
    rationale: "Synthetic priced-at-zero entry: zero requires not_charged, not defaulted."
    scope: {nodes_spanned: [1, 8]}

  # A value copied from a sibling: fitted in lineage but not against its own term, so
  # fitted: false, and method: copied requires copied_from.
  coeff_copied:
    value: 0.45
    units: dimensionless
    method: copied
    fitted: false
    copied_from: coeff_a
    rationale: "Synthetic copied entry to exercise the copied provenance shape."
    scope: {hardware: [OtherExampleGPU]}
