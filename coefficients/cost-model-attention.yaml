      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/gb200/attention/vllm/0.25.0/generation_attention_perf.parquet (NVIDIA GB200), 34632 full-attention points", role: primary}
      rationale: >
        Geometric error 1.283x, the best fit of the five, against 34.6x under a pure KV read
        — the largest error the old form made, because this part's bandwidth is highest and
