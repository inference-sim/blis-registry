# Backend manifest: roofline
#
# A backend declares the coefficient NAMES it consumes. The validator checks a set
# against this list, so a coefficient the backend prices but the set omits is refused
# BY NAME rather than defaulted silently. A name absent from this list is a term the
# backend does not price (ABSENT); that is distinct from a term priced at zero cost
# (value: 0 with method: not_charged) in a set.
#
# The roofline backend estimates latency from hardware peaks discounted by a
# model-utilization factor (MFU): prefill and decode each carry their own discount.
# The real values are transcribed by a later coefficient-set task; this manifest only
# fixes the names those values must appear under.
consumes:
  - mfu_prefill
  - mfu_decode
