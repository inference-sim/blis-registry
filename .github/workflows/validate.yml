name: validate

# Run the validator's own unit tests (which prove the schema checks over many in-test
# sets) and the strict validator over every committed set in coefficients/ — on every push
# to main and every pull request. A rejection or a failing test fails the job.
# coefficients/ may be empty until real sets are transcribed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validator unit tests
        run: python -m pytest validator/ -q

      - name: Validate every committed coefficient set
        run: python validator/validate.py

  # Validate every committed set through blis-schemas — the Go schema every consumer
  # actually loads these files through (blis-latency-kernel reads them via
  # blisschemas.LoadCoefficientSet, not through this repo's Python validator). The two
  # validators check different things, so a set can satisfy one and be rejected by the
  # other; without this job that divergence surfaces downstream, in another repository,
  # about a file this one published. This gate catches it on the PR that introduces it.
  #
  # Rule ownership — stated so a rule is not added to one validator and silently absent
  # from the other. The two deliberately overlap on scope; this names the authority for
  # each class of check, not a promise they never touch the same field:
  #   * blis-schemas (Go) owns document SHAPE and resolver-facing invariants — required
  #     fields, the units / method / source-kind / source-role enums, finiteness, a
  #     non-empty scope, and the duplicate-(name, scope) rule a resolver's last-wins
  #     stacking depends on. It fixes the scope DIMENSIONS structurally, as typed fields.
  #   * this repository's Python validator owns PROVENANCE and evidence policy —
  #     required-by-method sources, rationale, ci95 consistency, supersession — and the
  #     scope-key allow-list (validator/schema.py SCOPE_KEYS).
  #
  # blis-schemas has no release tag, so it is pinned by SHA rather than floated on main:
  # a pinned gate does not redden an unrelated registry PR when the schema changes, and a
  # schema bump is a deliberate single-line edit here.
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@v4

      # Hold the registry to one flat, lowercase-.yaml set per file — the convention the
      # README states. The Go gate globs coefficients/*.yaml while the Python validator
      # discovers coefficients/ recursively (.yaml/.yml, case-insensitive); enforcing the
      # convention here keeps the two gates' coverage identical, so no set can be checked
      # by one and silently escape the other.
      - name: Enforce the flat-.yaml set convention (gate coverage parity)
        run: |
          missed=$(comm -23 \
            <(find coefficients -type f \( -iname '*.yaml' -o -iname '*.yml' \) | sort) \
            <(find coefficients -maxdepth 1 -type f -name '*.yaml' | sort))
          if [ -n "$missed" ]; then
            echo "::error::coefficient set(s) the Python validator checks but the Go schema gate (coefficients/*.yaml) would skip — nested path, .yml, or non-lowercase .yaml:"
            echo "$missed"
            exit 1
          fi

      - name: Check out blis-schemas (pinned)
        uses: actions/checkout@v4
        with:
          # PIN: blis-schemas PR #38 head (on the fork) — the commit that introduces
          # cmd/validate-registry. Bump repository -> inference-sim/blis-schemas and
          # ref -> the main merge SHA once #38 merges.
          repository: namasl/blis-schemas
          ref: 2a27926381b206882e60c591e3831738ce5154d2
          path: blis-schemas

      # setup-go after the blis-schemas checkout so the version comes from that module's
      # own go.mod (no hard-coded version to drift) and caching keys on its go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: blis-schemas/go.mod
          cache-dependency-path: blis-schemas/go.sum

      - name: Validate every committed set through the Go schema
        working-directory: blis-schemas
        # cmd/validate-registry globs <root>/coefficients/*.yaml, LoadCoefficientSet +
        # Validate each, nonzero on any failure. The convention guard above keeps that
        # glob and the Python validator's recursive discovery over the same set of files.
        run: go run ./cmd/validate-registry "$GITHUB_WORKSPACE"
