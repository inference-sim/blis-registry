name: validate

# Run the strict validator over every committed coefficient set, and the validator's
# own unit tests, on every push and pull request. A rejection or a failing test fails
# the job — this is the CI gate the schema contract (registry issue #1) requires.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validator unit tests
        run: python -m pytest validator/ -q

      - name: Validate every committed coefficient set
        run: python validator/validate.py operators/
