# Example of `extends` — illustrative values only.
#
# This set inherits from `example` (operators/example.yaml) and overrides a single
# coefficient. It exists so CI exercises the `extends` inheritance path over a COMMITTED
# set, not just in unit tests: it provides only `mfu_decode` itself and relies on
# `mfu_prefill` being inherited to satisfy the roofline backend's consumed-names check.
#
# Values are illustrative, NOT real registry numbers (R2 is value-preserving; real
# values arrive in R2G2/G3/G3b/G4). Do not cite them.
name: example-extends
backend: roofline
extends: example

coefficients:
  # Overrides the inherited mfu_decode with a different illustrative discount/scope.
  # mfu_prefill is NOT restated here — it is inherited from `example`, and the backend
  # consumed-names check passes only because inheritance is resolved.
  mfu_decode:
    value: 0.28
    units: dimensionless
    method: literature
    fitted: false
    sources: ["https://github.com/inference-sim/inference-sim/discussions/589"]
    rationale: "Illustrative decode MFU override to demonstrate `extends`."
    scope: {hardware: [A100]}
