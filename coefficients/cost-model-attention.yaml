      rationale: >
        21.9x to 1.647x.
  - attention_prefill_floor:
      value: 13.0
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [l40s]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/l40s/attention/vllm/0.24.0/context_attention_perf.parquet (NVIDIA L40S), 26267 full-attention points", role: primary}
      rationale: >
        The lowest prefill floor of the four parts, and the only one below its own decode
