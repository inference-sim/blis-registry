# Roofline MFU discounts — A100-SXM.
#
# One roofline set per GPU (coefficients is a map of single-scalar entries, so GPUs with
# different MFU numbers cannot share one set). Only the two MFU discounts are transcribed;
# TFlopsPeak / TFlopsFP8 / BwPeakTBs stay catalog facts (hardware/a100-sxm.yaml), cited by
# the backend at run time, never written here.
#
# Value-preserving: 0.38 / 0.18 are the shipped A100-SXM numbers (catalog
# hardware/a100-sxm.yaml and inference-sim hardware_config.json), relocated with their
# provenance. See also roofline-a100-80.yaml — the A100-80 alias defaults.yaml uses for
# A100 model entries carries the identical pair under its own scope.
kind: CoefficientSet
backend: roofline

coefficients:
  mfu_prefill:
    value: 0.38
    units: dimensionless
    method: literature
    fitted: false
    sources:
      - {kind: discussion, cite: "inference-sim#589", role: primary}
      - {kind: publication, cite: "Korthikanti et al., Reducing Activation Recomputation (MLSys 2022): 54.2% MFU on A100 (training)", role: upper_bound}
      - {kind: publication, cite: "Chowdhery et al., PaLM (2022): 46.2% MFU on TPUv4", role: supporting}
    rationale: >
      A100 training reaches ~54% MFU (Megatron-LM 530B); vLLM production prefill on
      1K-4K-token batches is observed at 35-40%. Inference lacks backward-pass
      optimization and runs variable batch sizes, so the sustained prefill discount is
      set conservatively at 0.38, below the training ceiling.
    scope: {hardware: [A100-SXM]}

  mfu_decode:
    value: 0.18
    units: dimensionless
    method: literature
    fitted: false
    sources:
      - {kind: discussion, cite: "inference-sim#589", role: primary}
    rationale: >
      A100 decode is heavily memory-bound: the 312 TFLOPS / 2.0 TB/s roofline crossover is
      ~156 FLOP/byte, while small-batch decode GEMMs run at ~2-4 FLOP/byte, so most decode
      falls below the crossover. Even at large batch (B≈128), where decode turns
      compute-bound, measured utilization is only 15-20%; 0.18 is the upper end of that
      range, conservative for capacity planning.
    scope: {hardware: [A100-SXM]}
