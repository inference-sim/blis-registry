# Roofline MFU discounts — L40S.
#
# One roofline set per GPU; only the two MFU discounts are transcribed. The vendor specs
# stay catalog facts (hardware/l40s.yaml), cited by the backend at run time. Note the
# catalog file flags a known TFlopsFP8 sparsity-convention discrepancy on L40S; that is a
# vendor-spec issue owned upstream and does not touch these two MFU discounts.
#
# Value-preserving: 0.32 / 0.08 are the shipped L40S numbers (catalog hardware/l40s.yaml
# and inference-sim hardware_config.json), relocated with their provenance.
kind: CoefficientSet
backend: roofline

coefficients:
  mfu_prefill:
    value: 0.32
    units: dimensionless
    method: literature
    fitted: false
    sources:
      - {kind: discussion, cite: "inference-sim#589", role: primary}
      - {kind: publication, cite: "NVIDIA Ada Lovelace Architecture Whitepaper (2022)", role: supporting}
    rationale: >
      L40S is a PCIe Ada-Lovelace card whose 0.864 TB/s bandwidth (43% of A100's) dominates
      despite comparable compute, so prefill MFU sits below A100's 0.38. Held at the #589
      estimate of 0.32, a bandwidth-constrained discount reflecting partial
      memory-boundedness of prefill on this fabric.
    scope: {hardware: [L40S]}

  mfu_decode:
    value: 0.08
    units: dimensionless
    method: literature
    fitted: false
    sources:
      - {kind: discussion, cite: "inference-sim#589", role: primary}
    rationale: >
      L40S decode is almost always memory-bound: the 362 TFLOPS / 0.864 TB/s crossover is
      ~419 FLOP/byte, so even B=256 decode (~4 FLOP/byte) stays memory-bound, and PCIe adds
      small-GEMM launch overhead. Bandwidth-proportional scaling from A100's 0.18 gives
      0.18 × (0.864/2.0) ≈ 0.08.
    scope: {hardware: [L40S]}
