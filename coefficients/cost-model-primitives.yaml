# Cost-model primitives — every entry from NVIDIA AISimulate.
#
# GENERATED by scripts/emit_primitives.py. Re-run after an AISimulate data update
# and commit the diff rather than editing values here.
#
# Two kinds of number, both NVIDIA-sourced:
#
#   FITTED, from the measurement sweeps. The GEMM efficiency envelope
#   eff(M) = eps_max * M / (M + M_half), fitted per dtype against the per-M
#   envelope of achieved fraction of that dtype's dense peak; and the MoE
#   routing-imbalance multiplier, as order statistics of paired measurements that
#   differ in nothing but the routing distribution.
#
#   DECLARED, from AISimulate's own system descriptors (systems/<sku>.yaml). These
#   are numbers NVIDIA ships with its simulator, annotated there as corrections
#   based on observation. They are recorded as `vendor_spec` rather than
#   `measured`: NVIDIA observed them, this project did not, and the sweep behind
#   them is not published.
#
# The envelope is per SKU as well as per dtype, and the H100/H200 pair shows why
# it has to be. Those two share the GH100 die and therefore an identical compute
# peak, and their asymptotes agree to within 0.013 as that predicts. Their knees
# do not: M_half is 160 on H100 and 102 on H200, a factor of 1.57. The knee is set
# by how fast operands reach the tensor cores, so it tracks memory bandwidth
# (3.35 against 4.8 TB/s) rather than compute. A model that carries one part's
# ramp to another on shared-die reasoning gets the asymptote right and the knee
# wrong, and the knee is what governs every decode-sized batch.
kind: CoefficientSet
name: cost-model-primitives

coefficients:

  # --- a100-80 (a100_pcie) ---
  - hbm_derate:
      value: 0.8
      units: dimensionless
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        The fraction of datasheet HBM bandwidth a real access stream achieves. NVIDIA ships this in its own system descriptor, annotated there as a correction based on observation. Applied to the catalog's BwPeakTBs. vendor_spec rather than measured: NVIDIA observed it, this project did not, and the sweep behind it is not published.
  - hbm_constant_latency:
      value: 3.0
      units: us_per_transfer
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        A fixed floor on any memory access, below which a transfer's size stops mattering. At batch 32 the HBM term is milliseconds and this is noise, but for a small elementwise kernel it dominates.
  - host_link_bandwidth:
      value: 32000.0
      units: bytes_per_us
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        32 GB/s single-direction over the CPU-to-GPU link, which is what an offload tier's transfer crosses in addition to host memory. NVIDIA's descriptor states this per part, and the value differs by platform: a Grace-Blackwell part connects over NVLink-C2C rather than PCIe, so a tier that is a liability on one host can be affordable on another. Nominal link rate, not a measured payload throughput; a real transfer reaches a fraction of it.
  - p2p_latency:
      value: 10.0
      units: us_per_hop
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Point-to-point latency between two GPUs, which NVIDIA's descriptor carries as a single per-part figure. The measured per-operation collective floors in cost-model-collectives supersede this for pricing a collective; it is recorded because it is the figure NVIDIA's own model uses, so a comparison against that model needs it.
  - nccl_communicator_bytes_2rank:
      value: 358612992
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 2 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried.
  - nccl_communicator_bytes_4rank:
      value: 411041792
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 4 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried.
  - nccl_communicator_bytes_8rank:
      value: 411041792
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 8 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried.
  - engine_workspace_bytes:
      value: 3758096384
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        3.8 GB of non-weight, non-KV occupancy NVIDIA's descriptor reserves, described there as covering CUDA-graph capture, workspace and the inaccuracy of the rest of the memory calculation. It is a lumped allowance rather than a decomposition, so the memory breakdown reports it as one term and does not claim to split it.

  # --- a100-sxm (a100_sxm) ---
  - gemm_eps_max_bf16:
      value: 0.899
      units: dimensionless
      method: measured
      fitted: true
      scope: {hardware: [a100-80, a100-sxm]}
      ci95: [0.85, 0.948]
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/a100_sxm/gemm/sglang/0.5.10/gemm_perf.parquet (NVIDIA A100-SXM4-80GB)", role: primary}
      rationale: >
        Least-squares fit of eff = eps_max * M / (M + M_half) to the per-M efficiency envelope of 35742 bfloat16 rows against this part's dense bfloat16 peak, over 74 distinct M. RMS residual 0.049, which is the interval. Highest single observation 0.929. Measured under sglang/0.5.10 rather than the trtllm/1.3.0rc20 the other parts in this set use, because no trtllm/1.3.0rc20 collection exists for it; the value is therefore not strictly comparable with theirs.
  - gemm_m_half_bf16:
      value: 89
      units: tokens
      method: measured
      fitted: true
      scope: {hardware: [a100-80, a100-sxm]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/a100_sxm/gemm/sglang/0.5.10/gemm_perf.parquet (NVIDIA A100-SXM4-80GB)", role: primary}
      rationale: >
        The half-max row count from the same fit as gemm_eps_max_bf16.
  - moe_routing_imbalance_median:
      value: 1.001
      units: dimensionless
      method: measured
      fitted: false
      scope: {hardware: [a100-80, a100-sxm]}
      ci95: [0.812, 1.908]
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/a100_sxm/moe/sglang/0.5.10/moe_perf.parquet, distribution power_law_1.01 against balanced (NVIDIA A100-SXM4-80GB)", role: primary}
      rationale: >
        Ratio of measured latency under a power-law routing distribution to the same shape under a balanced one, over 18522 shapes differing in nothing but the distribution. Median 1.001; the interval is the 10th and 90th percentiles and the maximum observed is 16.1. The spread is the finding: at the median a skewed distribution costs a few percent and at the 90th percentile tens of percent, so a prediction sensitive to this term should carry the band rather than a point. Not marked fitted: an order statistic of measured ratios, not a curve fit. Measured under sglang/0.5.10 rather than the trtllm/1.3.0rc20 the other parts in this set use, so not strictly comparable with theirs.
