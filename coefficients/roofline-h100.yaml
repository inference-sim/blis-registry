# Roofline MFU discounts — H100.
#
# The roofline backend estimates step time as max(compute_time, memory_time). Its compute
# branch divides analytic FLOPs by (TP × PeakFLOPS × MFU): prefill and decode each carry
# their own model-FLOPs-utilization discount. This set transcribes those two discounts —
# and ONLY those two. The three vendor specs the backend also reads (TFlopsPeak, TFlopsFP8,
# BwPeakTBs) are catalog facts (hardware/h100.yaml), resolved at run time and cited here,
# never copied — their units (TFLOPs, TB/s) are not even in the schema's `units` enum.
#
# Value-preserving: 0.45 / 0.30 are the currently-shipped H100 numbers (catalog
# hardware/h100.yaml and inference-sim hardware_config.json), relocated with their
# provenance, not revised. The transcription test (validator/test_transcription.py)
# proves byte-identity against the shipped values.
kind: CoefficientSet
name: roofline-h100

coefficients:
  - mfu_prefill:
      value: 0.45
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
        - {kind: publication, cite: "Shah et al., FlashAttention-3 (2024): 75% attention MFU on H100", role: upper_bound}
        - {kind: publication, cite: "NVIDIA MLPerf Training v3.1 (2023): 55-60% MFU on GPT-3 175B", role: supporting}
      rationale: >
        H100 prefill is compute-bound; training reaches 55-60% MFU (MLPerf) with an
        attention-only ceiling near 75% (FlashAttention-3). Inference lacks backward-pass
        optimization and runs variable batch sizes, so the sustained prefill discount is
        set conservatively below the training figure at 0.45.
      scope: {hardware: [H100]}

  - mfu_decode:
      value: 0.30
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
        - {kind: publication, cite: "NVIDIA MLPerf Training v3.1 (2023): 55-60% MFU on GPT-3 175B", role: supporting}
      rationale: >
        H100 decode sits above A100's 0.18 because HBM3 and a larger L2 make small-batch
        decode less memory-bound and keep tensor-core utilization higher on the small GEMMs
        of large-batch decode. Held at 0.30 as an optimistic-end estimate, which is
        conservative for latency (higher MFU lowers compute_time, letting memory dominate).
      scope: {hardware: [H100]}
