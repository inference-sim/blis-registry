# Legacy CPU↔GPU KV-transfer coefficients (R2G3b, family #2).
#
# TRANSCRIBED, not regenerated. This set carries the legacy single-CPU-tier transfer numbers
# that belong in the registry: the fixed per-transfer base latency (cmd/root.go
# --kv-transfer-base-latency, default 0 ticks) and — added by blis-registry#17 — the
# dimensionless bandwidth residual that inference-sim#1819 defines (see WHY BANDWIDTH IS NOT
# HERE below, and the entry itself). Both are INERT unless --kv-cpu-blocks > 0 (the pre-#1590
# single-CPU-tier path, mutually exclusive with --kv-offload-config), so a committed run that
# does not enable that path is byte-identical (INV-6). Value-preserving (R2): each number is
# relocated with its provenance, never revised.
#
# WHY BANDWIDTH IS NOT HERE (issue #4 family-#2 spec + PR #14 review). The legacy
# --kv-transfer-bandwidth default (100.0 blocks/tick) is NOT transcribed: blocks/tick folds in
# a model-dependent block size, so it describes neither a bus nor a correction. The physical
# CPU↔GPU bandwidth is a CATALOG fact — blis-catalog devices/storage.yaml `cpu_dram`
# (read/write 2.0e4 MB/s, base_latency 1.0 µs) — and the model-dependent per-block tick cost
# (ticks = per_block_bytes / bandwidth + base_latency) is DERIVED by the simulator (companion
# inference-sim#1819). The only bandwidth-side number that CAN live here is the dimensionless
# efficiency RESIDUAL (achieved rate ÷ rated rate) — and #1819 / PR #1840's derive-from-catalog
# conversion now defines it against cpu_dram, so it IS authored below (the
# kv_transfer_bandwidth_residual entry, blis-registry#17), no longer deferred. The raw blocks/
# tick default itself stays untranscribed; only its value-preserving residual, against the named
# reference anchor, lives here.
#
# STANDALONE, name-identified (blis-registry#12): no `backend:`/`extends`.
kind: CoefficientSet
name: legacy-kv-transfer

coefficients:
  # --kv-transfer-base-latency default (cmd/root.go), 0 ticks (int64). This is the MODELLING
  # per-transfer latency (priced at zero today), NOT the device's physical latency: cpu_dram
  # already carries a physical base_latency of 1.0 µs in the catalog. The two are distinct
  # quantities — this one is an added, currently-uncharged per-transfer cost on the legacy
  # path — and must not be read as the same number. Mirrors the PD split: the modelling
  # --pd-transfer-base-latency placeholder is a registry coefficient (pd_transfer_base_latency,
  # pd-transfer-estimates.yaml), while the fabric carries no inherent base-latency fact at all —
  # blis-catalog#12 removed PDTransferBaseLatencyMs from the fabric classes (blis-registry#10).
  # Kept as int 0 to preserve the shipped type. method not_charged is forced by the zero-value rule.
  #
  # SCOPE NOTE: `hardware: [cpu_dram]` reuses the `hardware` scope key for a storage device
  # class (elsewhere it names GPUs, e.g. [H100]). There is no `device` scope key today, so
  # this is a mild stretch — flagged, not blocking; a `device` key is a later schema addition.
  - kv_transfer_base_latency:
      value: 0
      units: us_per_transfer
      method: not_charged
      fitted: false
      rationale: >
        Legacy fixed per-transfer latency on the pre-#1590 single-CPU-tier path, in
        microseconds per transfer (ticks == microseconds in the simulator clock). This is the
        MODELLING per-transfer cost, priced at zero today — DISTINCT from the physical
        cpu_dram base_latency (1.0 µs) held in the catalog, which describes the device itself.
        Ships at 0, so method not_charged per the zero-value rule. Inert unless
        --kv-cpu-blocks > 0.
      scope:
        hardware: [cpu_dram]

  # kv_transfer_bandwidth_residual — the dimensionless efficiency RESIDUAL (achieved rate ÷ rated
  # rate) for the legacy single-CPU-tier CPU↔GPU transfer. This is the bandwidth-side number the
  # header defers to; it exists only now that inference-sim#1819 / PR #1840 supplies the
  # derive-from-catalog conversion that defines it against cpu_dram. It is NOT a bandwidth (not a
  # blocks/tick or bytes/µs rate) — it is a bare multiplier on the catalog's rated cpu_dram
  # bandwidth, so nothing may read it as a rate. Hence units: dimensionless, the same shape as the
  # pd_transfer_overhead effective÷nominal correction (pd-transfer-estimates.yaml).
  #
  # PROVENANCE — value preservation, NOT a measurement. inference-sim#1819's governing invariant
  # is R2 (byte-identical stdout), so the residual is defined as whatever reproduces the retired
  # --kv-transfer-bandwidth default (100.0 tokens/tick) bit-for-bit. Its derivation, every term
  # taken at the named anchor below:
  #     retired default            = 100.0         tokens/tick  (the number preserved)
  #     cpu_dram rated read bw     = 2.0e4         bytes/µs     (catalog devices/storage.yaml;
  #                                                             == the 2.0e4 MB/s in the header)
  #     reference KVBytesPerToken  = 163840        bytes/token  (40 layers × 2 (K+V) × 128 head_dim
  #                                                             × 8 kv_heads × 2 bytes, bf16)
  #     nominal rate               = 2.0e4/163840  = 0.1220703125 tokens/tick  (derived)
  #     residual                   = 100.0/0.1220703125 = 819.2   (derived)
  # So method: assumed (a preserved modelling value — not measured, literature, vendor_spec, or
  # copied), fitted: false. It currently lives only as the Go constant legacyKVTransferResidual in
  # inference-sim cmd/kv_transfer_derive.go; per issue #17 that constant cites THIS entry as its
  # registry home, and its value-preservation test still pins 100.0 exactly.
  #
  # READ IT HONESTLY. 819.2 is NOT an efficiency ≤ 1. It records that the retired default asserted
  # ≈819× cpu_dram's rated bandwidth — which is exactly why the raw blocks/tick default was refused
  # as physics (see the header). It is preserved rather than corrected because R2 is
  # value-preserving; a physics correction is a separate, arguable change. Operators who want a
  # faithful CPU-offload cost should use --kv-offload-config, whose tiers price the catalog device
  # directly with no residual.
  #
  # SCOPE — one named anchor. The retired default was model-INDEPENDENT, but a residual measured
  # against cpu_dram is not: it folds in the reference KVBytesPerToken, so it is only meaningful at
  # the deployment #1819 anchors it to — qwen/qwen3-14b, H100, TP=1, block_size 16, bf16. There is
  # no `block_size` scope key today (SCOPE_KEYS = hardware/tp/ep/nodes_spanned/model), so the
  # block_size 16 part of the anchor is stated here in prose; model/hardware/tp carry the rest.
  - kv_transfer_bandwidth_residual:
      value: 819.2
      units: dimensionless
      method: assumed
      fitted: false
      rationale: >
        Dimensionless efficiency residual (achieved rate ÷ rated rate) for the legacy
        single-CPU-tier CPU↔GPU transfer. NOT a bandwidth — a bare multiplier on the catalog's
        rated cpu_dram bandwidth (2.0e4 bytes/µs), so nothing reads it as a rate. Value
        preservation, not a measurement (method: assumed): inference-sim#1819 / PR #1840 defines
        it as whatever reproduces the retired --kv-transfer-bandwidth default (100.0 tokens/tick)
        bit-for-bit — i.e. 100.0 ÷ (2.0e4 / 163840) = 819.2, where 163840 bytes/token is the
        reference KVBytesPerToken (qwen/qwen3-14b, H100, TP=1, block_size 16, bf16). Read it
        honestly: 819.2 is NOT an efficiency ≤ 1 — it records that the retired default asserted
        ≈819× cpu_dram's rated bandwidth, which is why a blocks/tick default was refused as
        physics; it is preserved, not corrected, because R2 is value-preserving. Operators wanting
        a faithful CPU-offload cost should use --kv-offload-config, whose tiers price the catalog
        device directly with no residual. Currently mirrored by the Go constant
        legacyKVTransferResidual (inference-sim cmd/kv_transfer_derive.go), which cites this entry.
      scope:
        model: [qwen/qwen3-14b]
        hardware: [H100]
        tp: [1]
