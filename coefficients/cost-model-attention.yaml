  - attention_decode_rate:
      value: 6880000.0
      units: bytes_per_us
      method: measured
      fitted: true
      scope: {hardware: [gb200-nvl72]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/gb200/attention/vllm/0.25.0/generation_attention_perf.parquet (NVIDIA GB200), 34632 full-attention points", role: primary}
      rationale: >
        6.88 TB/s, 0.86 of this part's 8.0 TB/s peak — the highest fraction of the five, so
        an attention kernel comes closest to saturating memory on this part.

# 10 entries: a floor and a rate for each of five parts.

  # --- Prefill attention -------------------------------------------------------
  #
  # A separate regime from decode: compute-bound and quadratic in prompt length rather than
  # bandwidth-bound in context. The cost model's FLOPs form is wrong here by 12.9x to 32.4x,
  # for two reasons it has no term for — a per-kernel floor, and the fact that an attention
  # kernel reaches under half the efficiency a well-shaped matmul does at the same token
  # count. The form is
  #
  #     latency = floor + causal_flops / (peak * eff(tokens) * work_scale)
  #
  # with causal_flops halving the naive count because attention attends only to earlier
  # positions. Reproduce with scripts/fit_attention_prefill.py.
  - attention_prefill_floor:
      value: 18.5
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/attention/vllm/0.25.0/context_attention_perf.parquet (NVIDIA H200), 27693 full-attention points", role: primary}
      rationale: >
        Higher than this part's 11 us decode floor, which is the expected direction: a
        context kernel sets up a causal mask and tiles over a two-dimensional problem where a
        generation kernel walks one row.
  - attention_prefill_work_scale:
      value: 0.44
      units: dimensionless
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/attention/vllm/0.25.0/context_attention_perf.parquet (NVIDIA H200), 27693 full-attention points", role: primary}
      rationale: >
        The fraction of the dense-GEMM efficiency ramp a prefill attention kernel reaches.
        0.48 means it achieves under half what a well-shaped matmul does at the same token
        count, which is why reusing the ramp unmodified under-predicts. Paired with the floor
        it takes the geometric error from 22.9x to 1.639x.
  - attention_prefill_floor:
      value: 19.5
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/attention/vllm/0.25.0/context_attention_perf.parquet (NVIDIA H100 80GB HBM3), 27693 full-attention points", role: primary}
      rationale: >
