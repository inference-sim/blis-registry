# Roofline MFU discounts — H200 (carried over from H100, UNVALIDATED).
#
# H200 shares the H100 GH100 Hopper compute die, so its MFU pair is carried over from H100
# (Discussion #589) rather than calibrated for H200. This set records that provenance
# honestly instead of presenting the values as H200 calibration: the rationale states the
# carry-over and the open H200-specific fit (#1711). The values are still `literature`
# (their basis is #589, not an H200 measurement); `fitted: false` holds because no fit
# treated them as free parameters.
#
# Only the two MFU discounts are transcribed; TFlopsPeak / TFlopsFP8 / BwPeakTBs stay
# catalog facts (hardware/h200.yaml). H200's memory advantage (4.8 vs 3.35 TB/s) flows
# through BwPeakTBs on the memory branch, which is why the carried-over mfu_prefill
# transfers cleanly (prefill is compute-bound on the identical die) and memory-bound decode
# — the common case — is unaffected; only large-batch compute-bound decode binds mfu_decode
# directly, and there this carried-over value is unvalidated.
#
# Value-preserving: 0.45 / 0.30 are the shipped H200 numbers (catalog hardware/h200.yaml
# and inference-sim hardware_config.json), identical to H100 by carry-over.
kind: CoefficientSet
name: roofline-h200

coefficients:
  - mfu_prefill:
      value: 0.45
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
        - {kind: publication, cite: "Shah et al., FlashAttention-3 (2024): 75% attention MFU on H100", role: upper_bound}
      rationale: >
        Carried over from H100 (#589): H200 shares the GH100 Hopper die, so peak FLOPs and
        the compute-bound prefill regime are identical and the H100 prefill discount transfers
        cleanly. Not an H200-specific calibration; an H200 MFU fit is tracked in #1711.
      scope: {hardware: [H200]}

  - mfu_decode:
      value: 0.30
      units: dimensionless
      method: literature
      fitted: false
      sources:
        - {kind: discussion, cite: "inference-sim#589", role: primary}
      rationale: >
        Carried over from H100 (#589) and UNVALIDATED for H200. Small-batch (memory-bound)
        decode is unaffected because H200's higher bandwidth flows through BwPeakTBs on the
        memory branch; but large-batch compute-bound decode binds this value directly, where
        the carried-over H100 number is not validated for H200. An H200-specific fit is
        tracked in #1711.
      scope: {hardware: [H200]}
